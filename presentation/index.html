    <title>Huffman frente a LZW</title>

  <body>
    <!-- tabindex lets the component take keyboard focus (arrows, Space, Backspace, P). -->

      <hyperframes-player interactive style="position: absolute; inset: 0" src="composition/index.html"></hyperframes-player>
      <!-- Copy of the block in composition/index.html: the component reads it from here. Keep both in sync. -->
    <script type="application/hyperframes-slideshow+json">
{
  "slides": [
    {
      "sceneId": "portada",
      "notes": "Expositor 1 · ~40 s. Buenos días. Somos el grupo y vamos a comparar dos algoritmos clásicos de compresión sin pérdida: Huffman y LZW. Sin pérdida significa que al descomprimir recuperamos exactamente el archivo original. Los comparamos de dos formas: con el análisis teórico y con experimentos sobre 26 archivos reales. La exposición tiene cinco partes y cada uno de nosotros presenta una, como se ve en la barra inferior."
    },
    {
      "sceneId": "problema",
      "notes": "Expositor 1 · ~50 s. Comprimir es eliminar redundancia, y la palabra abracadabra muestra dos maneras de verla. Huffman mira cada letra por separado: la a aparece 5 de 11 veces, así que conviene escribirla con menos bits. LZW mira frases: abra aparece dos veces, así que conviene reemplazar la frase completa por un código. Nuestra pregunta es cuál de las dos ideas funciona mejor, en tamaño y en velocidad, y si los resultados coinciden con la teoría. Le paso la palabra a quien explica Huffman."
    },
    {
      "sceneId": "huffman",
      "notes": "Expositor 2 · ~45 s. Huffman le da a cada símbolo un código según su frecuencia: el más frecuente recibe el más corto. En abracadabra, la a aparece cinco veces y recibe un solo bit, el cero. Las otras letras reciben tres bits. Así, el texto pasa de 88 bits a 23. Un detalle importante: ningún código es el comienzo de otro, por eso se puede decodificar sin separadores. Ojo, los 23 bits no incluyen la cabecera con la tabla de códigos, que el archivo real sí guarda."
    },
    {
      "sceneId": "huffman-arbol",
      "notes": "Expositor 2 · ~45 s. Los códigos salen de un árbol. Se unen siempre los dos nodos menos frecuentes hasta que queda uno solo. Aquí primero se unen c y d, luego b y r. Cada camino desde la raíz es un código: izquierda es cero, derecha es uno. Nuestro programa después reordena los códigos en forma canónica, con las mismas longitudes. Para codificar se recorren los datos dos veces, una para contar y otra para escribir; por eso el tiempo es lineal más sigma log sigma, donde sigma es la cantidad de símbolos distintos. Para decodificar se baja por el árbol bit a bit. Le paso la palabra a quien explica LZW."
    },
    {
      "sceneId": "lzw",
      "notes": "Expositor 3 · ~45 s. LZW no cuenta frecuencias: aprende frases mientras lee. El diccionario empieza con los 256 bytes posibles. En cada paso, busca la frase más larga que ya conoce, emite su código y guarda esa frase más la letra siguiente como una entrada nueva. En nuestra implementación, el código 256 es CLEAR y las frases nuevas empiezan en el 257. Lo interesante es que el diccionario no se envía: el decodificador lo reconstruye igual."
    },
    {
      "sceneId": "lzw-ejemplo",
      "notes": "Expositor 3 · ~45 s. Veamos abababa, siete letras. Primero emite a y guarda ab; luego emite b y guarda ba. Después ya conoce ab, emite el 257 y guarda aba. Al final conoce aba completa y emite el 259. Siete letras quedan en cuatro códigos: con códigos de 9 bits, son 36 bits en lugar de 56. Cuanto más se repite una frase, más larga se vuelve la entrada del diccionario. Todo ocurre en una sola pasada. Le paso la palabra a quien presenta los experimentos."
    },
    {
      "sceneId": "metodo",
      "notes": "Expositor 4 · ~45 s. Diseñamos tres experimentos, cada uno con una pregunta. E1 mide si el tiempo crece de forma lineal, con entradas de 16 KiB a 16 MiB. E2 controla la entropía con datos aleatorios, para ver qué pasa cuando no hay frases repetidas. E3 usa 26 archivos reales de los corpus Canterbury y Silesia. Si preguntan cómo medimos el tiempo, el botón de abajo a la izquierda abre el protocolo; la tecla Retroceso vuelve aquí.",
      "hotspots": [
        {
          "id": "h-protocolo",
          "label": "¿Cómo se midió el tiempo?",
          "target": "protocolo",
          "region": {
            "x": 6.25,
            "y": 71,
            "w": 30,
            "h": 8
          }
        }
      ]
    },
    {
      "sceneId": "tiempo",
      "notes": "Expositor 4 · ~50 s. El gráfico usa escala logarítmica en ambos ejes, así que una recta con pendiente 1 significa tiempo lineal: el doble de datos, el doble de tiempo. Las pendientes medidas van de 0.85 a 1.08, y una réplica independiente dio de 0.93 a 1.02. La teoría se confirma. A la derecha, la sorpresa: Huffman codifica más rápido, pero decodifica más lento, porque lee bit a bit. LZW es al revés, porque al codificar consulta una tabla hash por cada byte. Le paso la palabra para los resultados de tamaño."
    },
    {
      "sceneId": "tamano",
      "notes": "Expositor 5 · ~50 s. Ahora el tamaño, en bits por byte: menos es mejor y 8 significa sin comprimir. En archivos reales, LZW gana en 24 de 26; en XML baja de 5.55 a 1.66, porque el texto estructurado repite frases. Las dos excepciones son E.coli, que es ADN, y x-ray, una radiografía: casi no repiten frases. Y con bytes aleatorios del experimento E2, LZW llega a 11 bits por byte: agranda el archivo un 37 por ciento."
    },
    {
      "sceneId": "decision",
      "notes": "Expositor 5 · ~45 s. La conclusión práctica: el tipo de dato decide. Para texto, código o XML conviene LZW. Para pocos símbolos con frecuencias desiguales y sin frases, Huffman. Para datos aleatorios o ya comprimidos, lo mejor es no comprimir. Y si importa la velocidad, Huffman comprime más rápido y LZW descomprime más rápido. En resumen: ambos son lineales, como predice la teoría, pero gana el que encuentra la redundancia que el dato realmente tiene. Muchas gracias; quedamos atentos a sus preguntas."
    }
  ],
  "slideSequences": [
    {
      "id": "protocolo",
      "label": "Protocolo de medición",
      "slides": [
        {
          "sceneId": "protocolo",
          "notes": "Diapositiva de respaldo. Java optimiza el código mientras se ejecuta, así que la primera ejecución es engañosa: por eso calentamos antes de medir. Cada ejecución verifica que descomprimir devuelve la entrada exacta. Reportamos la mediana de 7 a 21 ejecuciones, que resiste valores atípicos, con su intervalo de confianza del 95 %. Retroceso vuelve a la metodología."
        }
      ]
    }
  ]
}
    </script>
